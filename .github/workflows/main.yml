name: Validate streams

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      timeout:
        description: "Per-request timeout (seconds)"
        default: "10"
        type: string
      workers:
        description: "Concurrent checks"
        default: "100"
        type: string
      force:
        description: "Write results even if far fewer streams pass than last run"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: validate-streams
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate streams
        env:
          TIMEOUT: ${{ inputs.timeout || '10' }}
          WORKERS: ${{ inputs.workers || '100' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python validate.py --timeout "$TIMEOUT" --workers "$WORKERS" $FORCE

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A validated_streams.json validation_stats.json playlist.m3u playlists
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          working=$(python -c "import json; print(json.load(open('validation_stats.json'))['working_streams'])")
          git commit -m "Update streams: ${working} working ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
